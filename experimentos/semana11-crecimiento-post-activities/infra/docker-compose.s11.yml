name: rachapro-s11

services:
  postgres:
    image: postgres:17
    container_name: rachapro-postgres-s11
    restart: "no"

    environment:
      POSTGRES_DB: rachapro_perf_s11
      POSTGRES_USER: ${S11_POSTGRES_USER:?Variable requerida}
      POSTGRES_PASSWORD: ${S11_POSTGRES_PASSWORD:?Variable requerida}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_s11_data:/var/lib/postgresql/data
      - ../../../infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_s11_data:
