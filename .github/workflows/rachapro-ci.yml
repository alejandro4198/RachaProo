name: RachaPro CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rachapro_perf_s11
          POSTGRES_USER: rachapro_user_s11
          POSTGRES_PASSWORD: 123456789
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile Kotlin
        run: ./gradlew compileKotlin --no-daemon

      - name: Run Backend Tests
        env:
          RACHAPRO_DB_URL: jdbc:postgresql://localhost:5433/rachapro_perf_s11
          RACHAPRO_DB_USER: rachapro_user_s11
          RACHAPRO_DB_PASSWORD: 123456789
          RACHAPRO_JWT_SECRET: testSecretKeyForJwtSigningAndValidationPurposesOnly1234567890
          RACHAPRO_HIKARI_MAX_POOL_SIZE: 10
        run: ./gradlew test --no-daemon
